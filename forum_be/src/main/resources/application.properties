# ===== MySQL =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/forum_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
jwt.secret=${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast32Bytes!}
jwt.expiration=${JWT_EXPIRATION:1800000}

# ===== Server =====
server.port=${SERVER_PORT:8080}

#===== Redis =====
spring.data.redis.host = localhost
spring.data.redis.port = 6379

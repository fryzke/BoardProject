# ===== MySQL =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/forum_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
jwt.secret=${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast32Bytes!}
jwt.expiration=${JWT_EXPIRATION:1800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===== Cookie =====
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:Lax}

# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===== Multipart / File Upload =====
server.tomcat.max-http-form-post-size=${TOMCAT_MAX_POST_SIZE:10MB}
server.tomcat.max-swallow-size=${TOMCAT_MAX_SWALLOW_SIZE:10MB}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:2MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

# ===== File Storage & Policy =====
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
file.access-url-prefix=${FILE_ACCESS_URL_PREFIX:http://localhost:8080/uploads}
file.max-single-size=${FILE_MAX_SINGLE_SIZE:2097152}
file.max-total-size=${FILE_MAX_TOTAL_SIZE:10485760}
file.max-count=${FILE_MAX_COUNT:10}

# ===== Policy Constants =====
post.min-title-length=${POST_MIN_TITLE_LENGTH:2}
post.max-title-length=${POST_MAX_TITLE_LENGTH:100}
post.min-content-length=${POST_MIN_CONTENT_LENGTH:1}
post.max-content-length=${POST_MAX_CONTENT_LENGTH:20000}
post.max-pinned-count=${POST_MAX_PINNED_COUNT:5}

comment.max-depth=${COMMENT_MAX_DEPTH:9}
comment.max-content-length=${COMMENT_MAX_CONTENT_LENGTH:400}

auth.min-user-id-length=${AUTH_MIN_USER_ID_LENGTH:4}
auth.max-user-id-length=${AUTH_MAX_USER_ID_LENGTH:16}
auth.min-user-name-length=${AUTH_MIN_USER_NAME_LENGTH:2}
auth.max-user-name-length=${AUTH_MAX_USER_NAME_LENGTH:20}

# ===== Schedule =====
schedule.cron=${CLEANUP_SCHEDULE_CRON:0 0 3 * * *}
